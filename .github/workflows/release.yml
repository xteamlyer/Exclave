name: Release Build
on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
jobs:
  build:
    name: Build (${{ matrix.variant.name }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant:
          - name: main
            package: com.xteamlyer.testexcl
            app_name: Excl
            apk_prefix: Excl
            artifact_name: APKs-main
          - name: testexcl2
            package: com.xteamlyer.testexcl2
            app_name: Excl2
            apk_prefix: Excl2
            artifact_name: APKs-testexcl2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Update version.properties
        run: |
          if [ -f version.properties ]; then
            if grep -q "^PACKAGE_NAME=" version.properties; then
              sed -i "s|^PACKAGE_NAME=.*|PACKAGE_NAME=${{ matrix.variant.package }}|" version.properties
            else
              echo "PACKAGE_NAME=${{ matrix.variant.package }}" >> version.properties
            fi
          else
            echo "PACKAGE_NAME=${{ matrix.variant.package }}" > version.properties
          fi

      - name: Update app_name in strings.xml
        run: |
          FILE="app/src/main/res/values/strings.xml"
          sed -i 's|<string name="app_name"[^>]*>.*</string>|<string name="app_name" translatable="false">${{ matrix.variant.app_name }}</string>|' "$FILE"

      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets :app:assembleOssRelease --no-daemon

      - name: Sign APK
        uses: r0adkll/sign-android-release@master
        with:
          releaseDirectory: app/build/outputs/apk/oss/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename and Prepare APK
        run: |
          VERSION_NAME=$(grep "^VERSION_NAME=" version.properties | cut -d '=' -f2 | tr -d ' \r\n')
          APK_DIR="app/build/outputs/apk/oss/release"

          ORIGINAL_APK=$(find "$APK_DIR" -name "*arm64-v8a-unsigned-signed.apk" | head -n 1)

          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: arm64-v8a-unsigned-signed.apk not found!"
            exit 1
          fi

          NEW_NAME="${{ matrix.variant.apk_prefix }}-${VERSION_NAME}-arm64-v8a.apk"

          cp "$ORIGINAL_APK" "$NEW_NAME"
          echo "FINAL_APK=$NEW_NAME" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant.artifact_name }}
          path: ${{ env.FINAL_APK }}
          archive: false
